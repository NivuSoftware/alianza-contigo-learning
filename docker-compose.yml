services:
  frontend:
    build:
      context: ./frontend
      target: development
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_URL: /api/v1
    command: bun run dev -- --host 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    environment:
      FLASK_ENV: development
      FLASK_DEBUG: "1"
      DATABASE_URL: postgresql+psycopg://alianza:alianza@postgres:5432/alianza_contigo
      CORS_ORIGINS: http://localhost:5173
    command: sh -c "flask --app wsgi:app db upgrade && flask --app wsgi:app run --debug --host 0.0.0.0 --port 5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  postgres:
    image: postgres:17-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: alianza_contigo
      POSTGRES_USER: alianza
      POSTGRES_PASSWORD: alianza
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alianza -d alianza_contigo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  frontend_node_modules:
  postgres_data:
