services:
  frontend:
    build:
      context: ./frontend
      target: development
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_URL: /api/v1
    command: sh -c "bun install --frozen-lockfile && bun run dev -- --host 0.0.0.0"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - ./frontend/src/assets/logo_cert.png:/app/app/assets/logo_cert.png:ro
      - course_uploads:/app/uploads
    environment:
      FLASK_ENV: development
      FLASK_DEBUG: "1"
      DATABASE_URL: postgresql+psycopg://alianza:alianza@postgres:5432/alianza_contigo
      CORS_ORIGINS: http://localhost:5173
      FRONTEND_URL: http://localhost:5173
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-development-only-change-me}
      EMAIL_ADDRESS: ${EMAIL_ADDRESS:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      SMTP_SERVER: ${SMTP_SERVER:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      MAIL_SENDER: ${MAIL_SENDER:-Alianza Contigo}
      MAIL_RECIPIENT: ${MAIL_RECIPIENT:-}
      BANK_NAME: ${BANK_NAME:-BANCO DEL AUSTRO}
      BANK_ACCOUNT_TYPE: ${BANK_ACCOUNT_TYPE:-CUENTA CORRIENTE}
      BANK_ACCOUNT_NUMBER: ${BANK_ACCOUNT_NUMBER:-2401000456}
      BANK_ACCOUNT_HOLDER: ${BANK_ACCOUNT_HOLDER:-ALIANZACONTIGO S.A.S}
      BANK_ACCOUNT_ID: ${BANK_ACCOUNT_ID:-0195185840001}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-500}
      MAX_DOCUMENT_UPLOAD_MB: ${MAX_DOCUMENT_UPLOAD_MB:-25}
      MAX_VIDEO_UPLOAD_MB: ${MAX_VIDEO_UPLOAD_MB:-500}
      PAYPHONE_STORE_ID: ${PAYPHONE_STORE_ID:-}
      PAYPHONE_TOKEN: ${PAYPHONE_TOKEN:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    command: sh -c "flask --app wsgi:app db upgrade && flask --app wsgi:app run --debug --host 0.0.0.0 --port 5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  postgres:
    image: postgres:17-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: alianza_contigo
      POSTGRES_USER: alianza
      POSTGRES_PASSWORD: alianza
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alianza -d alianza_contigo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  frontend_node_modules:
  postgres_data:
  course_uploads:
